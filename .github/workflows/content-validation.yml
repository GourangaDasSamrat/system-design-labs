name: Content Validation

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.md'
      - '**.excalidraw'
      - '.markdownlintrc.json'
      - '.spellcheck-whitelist.txt'
      - '.github/workflows/content-validation.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.md'
      - '**.excalidraw'

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    outputs:
      lint-status: ${{ steps.lint.outputs.status }}
      lint-summary: ${{ steps.lint.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        id: lint
        continue-on-error: true
        run: |
          npm install -g markdownlint-cli
          OUTPUT=$(markdownlint "**/*.md" -c .markdownlintrc.json 2>&1 || true)
          if [ -z "$OUTPUT" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "summary=✅ All markdown files passed linting" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            ESCAPED=$(echo "$OUTPUT" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "summary=$ESCAPED" >> $GITHUB_OUTPUT
          fi

  spell-check:
    name: Spell-Check
    runs-on: ubuntu-latest
    outputs:
      spell-status: ${{ steps.spell.outputs.status }}
      spell-summary: ${{ steps.spell.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Run spellchecker
        id: spell
        continue-on-error: true
        run: |
          npm install -g cspell
          OUTPUT=$(cspell "**/*.md" --config .cspell.json 2>&1 || true)
          if [ -z "$OUTPUT" ] || ! echo "$OUTPUT" | grep -i "error"; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "summary=✅ No spelling errors detected" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            ESCAPED=$(echo "$OUTPUT" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "summary=$ESCAPED" >> $GITHUB_OUTPUT
          fi

  link-validation:
    name: Link Validation
    runs-on: ubuntu-latest
    outputs:
      link-status: ${{ steps.linkcheck.outputs.status }}
      link-summary: ${{ steps.linkcheck.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate internal links
        id: linkcheck
        continue-on-error: true
        run: |
          python3 << 'EOF'
          import os
          import re
          import json
          from pathlib import Path

          errors = []
          md_files = set()
          diagram_files = set()

          # Find all markdown and diagram files
          for root, dirs, files in os.walk('.'):
              # Skip hidden directories
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              for file in files:
                  path = os.path.join(root, file).lstrip('./')
                  if file.endswith('.md'):
                      md_files.add(path)
                  elif file.endswith('.excalidraw'):
                      diagram_files.add(path)

          # Validate links in markdown files
          for md_file in md_files:
              try:
                  with open(md_file, 'r', encoding='utf-8') as f:
                      content = f.read()
                      # Find markdown links [text](path)
                      pattern = r'\[([^\]]+)\]\(([^)]+)\)'
                      links = re.findall(pattern, content)

                      for link_text, link_path in links:
                          # Skip external links
                          if link_path.startswith('http://') or link_path.startswith('https://'):
                              continue

                          # Remove anchors
                          target_path = link_path.split('#')[0]

                          # Skip if empty
                          if not target_path:
                              continue

                          # Check if file exists
                          if target_path and not os.path.exists(target_path):
                              errors.append(f"{md_file}: Broken link -> {link_path}")
              except Exception as e:
                  errors.append(f"{md_file}: Error reading file - {str(e)}")

          if errors:
              print(f"status=failure")
              print(f"summary=❌ Found {len(errors)} broken internal links")
              for error in errors[:10]:  # Show first 10
                  print(f"  - {error}")
              if len(errors) > 10:
                  print(f"  ... and {len(errors) - 10} more")
          else:
              print("status=success")
              print("summary=✅ All internal links are valid")
          EOF
        shell: bash

  diagram-validation:
    name: Diagram Validation
    runs-on: ubuntu-latest
    outputs:
      diagram-status: ${{ steps.diagrams.outputs.status }}
      diagram-summary: ${{ steps.diagrams.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate excalidraw diagrams
        id: diagrams
        continue-on-error: true
        run: |
          python3 << 'EOF'
          import os
          import json
          from pathlib import Path

          errors = []

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              for file in files:
                  if file.endswith('.excalidraw'):
                      path = os.path.join(root, file).lstrip('./')
                      try:
                          with open(path, 'r', encoding='utf-8') as f:
                              content = f.read()
                              # Try to parse as JSON
                              data = json.loads(content)

                              # Basic structure validation
                              if not isinstance(data, dict):
                                  errors.append(f"{path}: Root element must be JSON object")
                              elif 'elements' not in data or 'appState' not in data:
                                  errors.append(f"{path}: Missing 'elements' or 'appState' properties")
                      except json.JSONDecodeError as e:
                          errors.append(f"{path}: Invalid JSON - {str(e)}")
                      except Exception as e:
                          errors.append(f"{path}: Error - {str(e)}")

          if errors:
              print(f"status=failure")
              print(f"summary=❌ Found {len(errors)} diagram validation errors")
              for error in errors[:5]:
                  print(f"  - {error}")
              if len(errors) > 5:
                  print(f"  ... and {len(errors) - 5} more")
          else:
              print("status=success")
              print("summary=✅ All diagrams have valid structure")
          EOF
        shell: bash

  create-or-close-issues:
    name: Issue Tracking
    needs: [markdown-lint, spell-check, link-validation, diagram-validation]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check validation status
        id: check
        run: |
          LINT_STATUS="${{ needs.markdown-lint.outputs.lint-status }}"
          SPELL_STATUS="${{ needs.spell-check.outputs.spell-status }}"
          LINK_STATUS="${{ needs.link-validation.outputs.link-status }}"
          DIAGRAM_STATUS="${{ needs.diagram-validation.outputs.diagram-status }}"

          if [ "$LINT_STATUS" = "failure" ] || [ "$SPELL_STATUS" = "failure" ] || [ "$LINK_STATUS" = "failure" ] || [ "$DIAGRAM_STATUS" = "failure" ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if validation failed
        if: steps.check.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { repo, issue } = context;

            let body = '## Content Validation Failed\n\n';
            body += '### Validation Results\n\n';

            const lint = '${{ needs.markdown-lint.outputs.lint-status }}';
            const spell = '${{ needs.spell-check.outputs.spell-status }}';
            const link = '${{ needs.link-validation.outputs.link-status }}';
            const diagram = '${{ needs.diagram-validation.outputs.diagram-status }}';

            if (lint === 'failure') {
              body += '❌ **Markdown Linting Failed**\n';
              body += '```\n${{ needs.markdown-lint.outputs.lint-summary }}\n```\n\n';
            } else {
              body += '✅ **Markdown Linting Passed**\n\n';
            }

            if (spell === 'failure') {
              body += '❌ **Spell-Check Failed**\n';
              body += '```\n${{ needs.spell-check.outputs.spell-summary }}\n```\n\n';
            } else {
              body += '✅ **Spell-Check Passed**\n\n';
            }

            if (link === 'failure') {
              body += '❌ **Link Validation Failed**\n';
              body += '```\n${{ needs.link-validation.outputs.link-summary }}\n```\n\n';
            } else {
              body += '✅ **Link Validation Passed**\n\n';
            }

            if (diagram === 'failure') {
              body += '❌ **Diagram Validation Failed**\n';
              body += '```\n${{ needs.diagram-validation.outputs.diagram-summary }}\n```\n\n';
            } else {
              body += '✅ **Diagram Validation Passed**\n\n';
            }

            body += `\n---\n**Commit:** ${context.sha.substring(0, 7)}\n`;
            body += `**Run:** [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            // Find existing issue
            const issues = await github.rest.issues.listForRepo({
              owner: repo.owner,
              repo: repo.repo,
              state: 'open',
              labels: ['content-validation']
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
              console.log(`Updated issue #${issues.data[0].number}`);
            } else {
              // Create new issue
              const created = await github.rest.issues.create({
                owner: repo.owner,
                repo: repo.repo,
                title: '🔴 Content Validation Issues',
                body: body,
                labels: ['content-validation', 'automation']
              });
              console.log(`Created issue #${created.data.number}`);
            }

      - name: Close issue if all validations pass
        if: steps.check.outputs.has_issues == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { repo } = context;

            const issues = await github.rest.issues.listForRepo({
              owner: repo.owner,
              repo: repo.repo,
              state: 'open',
              labels: ['content-validation']
            });

            if (issues.data.length > 0) {
              for (const issue of issues.data) {
                await github.rest.issues.update({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: issue.number,
                  body: issue.body + '\n\n---\n✅ **All validations passed!** Closing this issue.',
                  state: 'closed'
                });
                console.log(`Closed issue #${issue.number}`);
              }
            }

  validation-summary:
    name: Summary
    needs: [markdown-lint, spell-check, link-validation, diagram-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          echo "## Content Validation Summary"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Markdown Linting | ${{ needs.markdown-lint.outputs.lint-status }} |"
          echo "| Spell-Check | ${{ needs.spell-check.outputs.spell-status }} |"
          echo "| Link Validation | ${{ needs.link-validation.outputs.link-status }} |"
          echo "| Diagram Validation | ${{ needs.diagram-validation.outputs.diagram-status }} |"
          echo ""
          echo "### Details"
          echo ""
          echo "**Markdown Linting:** ${{ needs.markdown-lint.outputs.lint-summary }}"
          echo ""
          echo "**Spell-Check:** ${{ needs.spell-check.outputs.spell-summary }}"
          echo ""
          echo "**Link Validation:** ${{ needs.link-validation.outputs.link-summary }}"
          echo ""
          echo "**Diagram Validation:** ${{ needs.diagram-validation.outputs.diagram-summary }}"
